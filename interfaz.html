<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi RAG Local</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 { font-size: 1.2rem; color: #e94560; }
        header span { font-size: 0.8rem; color: #888; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mensaje {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .usuario {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ia {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #0f3460;
        }

        .fuentes {
            font-size: 0.75rem;
            color: #e94560;
            margin-top: 8px;
        }

        .pensando {
            background: #16213e;
            align-self: flex-start;
            border: 1px solid #0f3460;
            padding: 12px 16px;
            border-radius: 12px;
            color: #888;
            font-style: italic;
        }

        #entrada {
            background: #16213e;
            padding: 16px 24px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
        }

        #texto {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            resize: none;
            height: 48px;
        }

        #texto:focus { border-color: #e94560; }

        #boton {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        #boton:hover { background: #c73652; }
        #boton:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h1>🧠 Mi RAG Local</h1>
    <span>Python • Git • Docker | llama3.1 + ChromaDB</span>
</header>

<div id="chat">
    <div class="mensaje ia">
        Hola! Soy tu asistente local. Tengo cargados manuales de <strong>Python</strong>, <strong>Git</strong> y <strong>Docker</strong>. ¿Qué quieres saber?
    </div>
</div>

<div id="entrada">
    <textarea id="texto" placeholder="Escribe tu pregunta..."></textarea>
    <button id="boton" onclick="preguntar()">Enviar</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const texto = document.getElementById('texto');
    const boton = document.getElementById('boton');
    let historial = [];

    texto.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            preguntar();
        }
    });

    function agregarMensaje(contenido, tipo, fuentes = []) {
        const div = document.createElement('div');
        div.className = `mensaje ${tipo}`;
        div.innerHTML = contenido.replace(/\n/g, '<br>');
        if (fuentes.length > 0) {
            const f = document.createElement('div');
            f.className = 'fuentes';
            f.textContent = '📄 Fuentes: ' + fuentes.map(s => s.split('/').pop()).join(', ');
            div.appendChild(f);
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function preguntar() {
        const pregunta = texto.value.trim();
        if (!pregunta) return;

        agregarMensaje(pregunta, 'usuario');
        texto.value = '';
        boton.disabled = true;

        const pensando = document.createElement('div');
        pensando.className = 'pensando';
        pensando.textContent = 'Pensando...';
        chat.appendChild(pensando);
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch('http://localhost:8000/preguntar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: pregunta, historial })
            });

            const data = await res.json();
            chat.removeChild(pensando);
            agregarMensaje(data.respuesta, 'ia', data.fuentes);
            historial.push({ pregunta, respuesta: data.respuesta });

        } catch (e) {
            chat.removeChild(pensando);
            agregarMensaje('Error: no se pudo conectar con el servidor.', 'ia');
        }

        boton.disabled = false;
        texto.focus();
    }
</script>

</body>
</html>
